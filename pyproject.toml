[project]
name = "sokoflow"
version = "0.1.0"
description = "Headless WhatsApp ERP for Kenyan SMEs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.0",
    "orjson==3.10.3",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg[binary]==3.1.19",
    "celery==5.4.0",
    "redis==5.0.4",
    "tenacity==8.3.0",
    "reportlab==4.2.0",
    "python-dotenv==1.0.1",
    "httpx==0.27.0",
    "structlog==24.2.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "factory-boy==3.3.0",
    "fakeredis==2.23.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "celery-types==0.26.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

typeCheckingMode = "strict"

reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"

reportMissingTypeStubs = "none"

reportMissingParameterType = "error"
reportUnknownReturnType = "error"
reportUnusedImport = "warning"

[tool.uv]
package = false


[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "alembic/",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["alembic/"]
plugins = [
  "pydantic.mypy"
]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
