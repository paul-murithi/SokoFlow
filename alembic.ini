[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

# This is overridden at runtime from DATABASE_URL env var.
# See app/db/migrations/env.py
sqlalchemy.url = postgresql://sokoflow:sokoflow_dev@localhost:5432/sokoflow

[post_write_hooks]
# Format migrations with black after autogenerate
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 88 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
