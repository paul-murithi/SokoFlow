name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sokoflow
          POSTGRES_PASSWORD: sokoflow_test
          POSTGRES_DB: sokoflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      APP_ENV: test
      CORRELATION_ID_HEADER: X-Correlation-ID
      POSTGRES_PORT: "5432"
      TEST_DB_URL: postgresql+asyncpg://sokoflow:sokoflow_test@localhost:5432/sokoflow_test
      DATABASE_URL: postgresql+asyncpg://sokoflow:sokoflow_test@localhost:5432/sokoflow_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      SENDER_BACKEND: mock
      WHATSAPP_VERIFY_TOKEN: ci-test-verify-token
      WHATSAPP_APP_SECRET: ci-test-app-secret
      WHATSAPP_PHONE_NUMBER_ID: "1234567890"
      WHATSAPP_ACCESS_TOKEN: ci-test-access-token
      SECRET_KEY: ci-test-secret-key
      SESSION_TTL_SECONDS: 1800
      DEDUP_TTL_SECONDS: 60
      CELERY_TASK_MAX_RETRIES: 3
      CELERY_TASK_RETRY_BACKOFF: 2
      CELERY_TASK_RETRY_BACKOFF_MAX: 60
      REPORT_TMP_DIR: /tmp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff (linting & formatting)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run MyPy (type checking)
        run: uv run mypy app --ignore-missing-imports

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
